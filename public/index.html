<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HugoDécrypte — Hub d'Actualités</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #161920;
      --border: #262a35;
      --text-main: #f0f2f5;
      --text-muted: #8b92a0;
      --accent-insta: #e1306c;
      --accent-yt: #ff0000;
      --accent-pod: #1ed760;
      --accent-trend: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 30px 20px;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    header { text-align: center; max-width: 800px; margin: 0 auto 30px auto; }
    header h1 {
      font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    header p { color: var(--text-muted); font-size: 1rem; }

    /* BASCULE D'INTERFACE (PC / MOBILE) */
    .view-toggle-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .view-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .view-toggle-btn.active {
      background: var(--accent-trend);
      color: #fff;
      border-color: var(--accent-trend);
    }

    /* Barre de recherche */
    .search-container { max-width: 500px; margin: 20px auto 0 auto; position: relative; }
    .search-input {
      width: 100%; padding: 12px 42px 12px 18px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 30px; color: var(--text-main);
      font-size: 0.95rem; outline: none; transition: border-color 0.25s ease;
    }
    .search-input:focus { border-color: var(--accent-trend); }
    .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    /* Section Tendance */
    .trending-banner {
      max-width: 800px; margin: 20px auto 0 auto;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(22, 25, 32, 0.9) 100%);
      border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 16px; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 15px; cursor: pointer;
      transition: all 0.25s ease;
    }
    .trending-banner:hover { border-color: rgba(99, 102, 241, 0.8); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.2); }
    .trending-content { display: flex; flex-direction: column; gap: 4px; text-align: left; }
    .trending-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #a5b4fc; display: flex; align-items: center; gap: 6px; }
    .trending-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); line-height: 1.3; }
    .trending-badge-action { background: var(--accent-trend); color: #fff; font-size: 0.8rem; font-weight: 600; padding: 6px 14px; border-radius: 20px; white-space: nowrap; }

    /* Contrôles */
    .controls-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
    .tabs-container { display: flex; gap: 10px; flex-wrap: wrap; }
    
    .tab-btn {
      padding: 10px 22px; border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text-muted); border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
      transition: all 0.25s ease;
    }
    .tab-btn:hover { border-color: #3f4657; color: var(--text-main); }
    .tab-btn.active { background: var(--text-main); color: #000; border-color: var(--text-main); }

    .sub-tab-btn {
      padding: 6px 16px; border: 1px solid var(--border); background: #1a1d26;
      color: var(--text-muted); border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 0.82rem;
      transition: all 0.2s ease;
    }
    .sub-tab-btn:hover { border-color: var(--text-main); color: var(--text-main); }
    .sub-tab-btn.active-pod { background: var(--accent-pod); color: #000; border-color: var(--accent-pod); font-weight: 700; }
    .sub-tab-btn.active-yt { background: var(--accent-yt); color: #fff; border-color: var(--accent-yt); font-weight: 700; }

    .date-filter-box { display: flex; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border); padding: 6px 14px; border-radius: 30px; }
    .date-filter-box label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .date-input { background: transparent; border: none; color: var(--text-main); font-size: 0.9rem; font-family: inherit; outline: none; color-scheme: dark; cursor: pointer; }
    .reset-date-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0 4px; }
    .reset-date-btn:hover { color: var(--accent-yt); }

    .refresh-btn {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main);
      padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 0.88rem;
      display: flex; align-items: center; gap: 6px; transition: all 0.25s ease;
    }
    .refresh-btn:hover { border-color: #6366f1; background: #1e222d; }

    /* Grille de base (PC) */
    .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1280px; margin: 0 auto; }
    
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; display: flex; flex-direction: column; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .card.clickable { cursor: pointer; }
    .card:hover { transform: translateY(-6px); border-color: #3f4657; box-shadow: 0 16px 35px rgba(0, 0, 0, 0.45); }

    .card-insta {
      position: relative; border-radius: 18px; overflow: hidden; background: #161920; display: flex; flex-direction: column;
    }
    .card-insta .insta-img-container {
      width: 100%; background: #0b0d10; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .card-insta .insta-img-container img {
      width: 100%; height: auto; display: block; object-fit: contain;
    }
    .card-insta .insta-overlay {
      width: 100%; padding: 12px 16px; background: rgba(10, 12, 16, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; margin-top: auto;
    }

    .badge { font-size: 0.75rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-instagram { background: rgba(225, 48, 108, 0.25); color: #ff5388; border: 1px solid rgba(225, 48, 108, 0.4); }
    .badge-youtube { background: rgba(255, 0, 0, 0.15); color: var(--accent-yt); }
    .badge-podcast { background: rgba(30, 215, 96, 0.15); color: var(--accent-pod); }

    .carousel-tag {
      font-size: 0.78rem; font-weight: 600; color: #e2e8f0; background: rgba(255, 255, 255, 0.12);
      padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .media-box { position: relative; width: 100%; background: #0b0d10; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 300px; }
    .media-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 1.05rem; font-weight: 700; line-height: 1.4; margin-bottom: 10px; color: var(--text-main); }
    .card-caption { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; margin-top: auto; }
    .card-date { font-size: 0.82rem; color: #cbd5e1; font-weight: 600; }

    /* MODE INTERFACE TÉLÉPHONE FORCÉ */
    body.mobile-mode { padding: 10px 8px; }
    body.mobile-mode header h1 { font-size: 1.5rem; }
    body.mobile-mode .feed-grid { grid-template-columns: 1fr; gap: 15px; padding: 0 5px; }
    body.mobile-mode .card { border-radius: 14px; }
    body.mobile-mode .controls-container { flex-direction: column; gap: 10px; }
    body.mobile-mode .tabs-container { width: 100%; justify-content: center; }
    body.mobile-mode .tab-btn { padding: 8px 14px; font-size: 0.82rem; }
    body.mobile-mode .modal-card { max-height: 98vh; border-radius: 14px; margin: 5px; width: 100%; }
    body.mobile-mode .modal-media-box { height: 350px; }
    body.mobile-mode .modal-body { padding: 15px; }

    /* MODALE */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.active { display: flex; }
    
    .modal-card {
      background: #14171f; border: 1px solid #2a2f3e; border-radius: 24px; max-width: 850px; width: 100%;
      max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 35px 70px rgba(0,0,0,0.7);
    }
    .modal-close-btn {
      position: absolute; top: 18px; right: 18px; background: rgba(0, 0, 0, 0.6); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .modal-close-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .modal-media-box { position: relative; width: 100%; height: 600px; background: #000; overflow: hidden; display: flex; }
    .carousel-track { display: flex; height: 100%; width: 100%; will-change: transform; transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .carousel-track img { width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; }
    
    .carousel-nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.75); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
      z-index: 15; display: flex; align-items: center; justify-content: center; transition: background 0.2s;
    }
    .carousel-nav-btn:hover { background: rgba(0, 0, 0, 0.95); }
    .carousel-nav-btn.prev { left: 15px; } 
    .carousel-nav-btn.next { right: 15px; }
    .carousel-nav-btn.hidden { display: none !important; }

    .modal-body { padding: 25px 30px; overflow-y: auto; }
    .modal-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-title { font-size: 1.35rem; font-weight: 800; line-height: 1.3; color: var(--text-main); }
    .modal-footer-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }

    .toggle-desc-btn {
      background: #1e2430; border: 1px solid #333b4d; color: #cbd5e1; padding: 10px 18px; border-radius: 12px;
      cursor: pointer; font-size: 0.88rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease;
    }
    .toggle-desc-btn:hover { background: #283040; color: #fff; border-color: #4a5568; }

    .podcast-hero-box {
      background: linear-gradient(135deg, rgba(30, 215, 96, 0.1) 0%, rgba(22, 25, 32, 0.8) 100%);
      border: 1px solid rgba(30, 215, 96, 0.25); border-radius: 20px; padding: 24px; margin-top: 25px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 18px;
    }
    .player-controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .btn-player { background: #1e222d; border: 1px solid #323849; color: var(--text-main); width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
    .btn-player:hover { background: #2a3040; }
    .btn-player-main { background: var(--accent-pod); color: #000; width: 62px; height: 62px; font-size: 1.6rem; font-weight: bold; border: none; }
    .btn-player-main:hover { background: #22ee6b; }

    .progress-bar-container { display: flex; align-items: center; gap: 14px; width: 100%; }
    .time-label { font-size: 0.82rem; color: var(--text-muted); font-family: monospace; min-width: 42px; }
    .progress-bar { flex-grow: 1; height: 6px; background: #282e3d; border-radius: 3px; appearance: none; outline: none; cursor: pointer; }
    .progress-bar::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-pod); cursor: pointer; }

    .summary-card { background: #181c26; border: 1px solid #282d3d; border-radius: 16px; padding: 20px; margin-top: 15px; line-height: 1.6; font-size: 0.95rem; color: #cbd5e1; }
  </style>
</head>
<body>

  <header>
    <h1>HugoDécrypte</h1>
    <p>Le fil d'actualités centralisé en temps réel</p>

    <!-- BASCULE D'INTERFACE (PC / MOBILE) -->
    <div class="view-toggle-container">
      <button id="btnDesktopView" class="view-toggle-btn active" onclick="switchInterface('desktop')">🖥️ Mode PC</button>
      <button id="btnMobileView" class="view-toggle-btn" onclick="switchInterface('mobile')">📱 Mode Téléphone</button>
    </div>

    <!-- RECHERCHE -->
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un mot-clé (ex: Trump, Élections, Climat...)" oninput="handleSearch(this.value)">
      <span class="search-icon">🔍</span>
    </div>

    <!-- TENDANCE -->
    <div id="trendingBanner" class="trending-banner" style="display: none;" onclick="openTrendingItem()">
      <div class="trending-content">
        <span class="trending-label">🔥 À la une du jour</span>
        <span class="trending-title" id="trendingTitle">Calcul de la tendance...</span>
      </div>
      <span class="trending-badge-action">Découvrir</span>
    </div>

    <div class="controls-container">
      <div class="tabs-container">
        <button class="tab-btn active" onclick="filterFeed('instagram', event)">📸 Instagram</button>
        <button class="tab-btn" onclick="filterFeed('youtube', event)">▶️ YouTube</button>
        <button class="tab-btn" onclick="filterFeed('podcast', event)">🎙️ Podcasts</button>
      </div>

      <div class="date-filter-box">
        <label for="datePicker">📅 Date :</label>
        <input type="date" id="datePicker" class="date-input" onchange="applyDateFilter(this.value)">
        <button class="reset-date-btn" title="Réinitialiser" onclick="resetDateFilter()">✕</button>
      </div>

      <button class="refresh-btn" onclick="manualRefreshData()" title="Mettre à jour les flux">
        🔄 Rafraîchir
      </button>
    </div>

    <div id="podcastThemesContainer" class="tabs-container" style="display: none; margin-top: 15px; justify-content: center;">
      <button class="sub-tab-btn active-pod" onclick="filterPodcastTheme('all', event)">🌐 Tous les thèmes</button>
      <button class="sub-tab-btn" onclick="filterPodcastTheme('Infos', event)">📰 Infos</button>
      <button class="sub-tab-btn" onclick="filterPodcastTheme('Médias', event)">📺 Médias</button>
      <button class="sub-tab-btn" onclick="filterPodcastTheme('Culture', event)">🎭 Culture</button>
    </div>

    <!-- SOUS-ONGLETS YOUTUBE CHAÎNES -->
    <div id="youtubeChannelsContainer" class="tabs-container" style="display: none; margin-top: 15px; justify-content: center;">
      <button class="sub-tab-btn active-yt" onclick="filterYoutubeChannel('actus', event)">📰 Actus du jour</button>
      <button class="sub-tab-btn" onclick="filterYoutubeChannel('grands_formats', event)">🎬 Grands formats</button>
    </div>

    <div id="youtubeFormatsContainer" class="tabs-container" style="display: none; margin-top: 15px; justify-content: center;">
      <button class="sub-tab-btn active-yt" onclick="filterYoutubeFormat('all', event)">🌐 Tous les formats</button>
      <button class="sub-tab-btn" onclick="filterYoutubeFormat('long', event)">🎬 Vidéos longues</button>
      <button class="sub-tab-btn" onclick="filterYoutubeFormat('short', event)">📱 Vidéos courtes</button>
    </div>
  </header>
  <main>
    <div id="feedGrid" class="feed-grid"></div>
  </main>

  <!-- MODALE -->
  <div id="mediaModal" class="modal-overlay" onclick="closeModalOnBg(event)">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      
      <div id="modalMediaContainer"></div>

      <div class="modal-body">
        <div class="modal-meta">
          <span id="modalBadge" class="badge"></span>
          <span id="modalDate" class="card-date"></span>
        </div>
        <h2 id="modalTitle" class="modal-title"></h2>

        <div id="modalDescriptionSection"></div>

        <div class="modal-footer-controls">
          <button id="toggleDescBtn" class="toggle-desc-btn" onclick="toggleFullDescription()" style="display: none;">
            📜 Lire la description complète
          </button>
          <a id="modalExternalLink" href="#" target="_blank" class="toggle-desc-btn" style="text-decoration: none; display: none;">
            🔗 Ouvrir sur la plateforme originale
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allMedia = [];
    let currentTab = 'instagram';
    let currentPodcastTheme = 'all';
    let currentYoutubeChannel = 'actus';
    let currentYoutubeFormat = 'all';
    let currentSearchQuery = '';
    let selectedDateFilter = '';
    let trendingItemData = null;

    let currentModalItem = null;
    let currentImgIndex = 0;
    let isFullDescVisible = false;

    // Variables du lecteur audio natif Podcast
    let audioPlayer = null;
    let isPlaying = false;
    let audioTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
    });

    async function loadData() {
      try {
        const response = await fetch('all_media_data.json?' + new Date().getTime());
        if (!response.ok) throw new Error("Fichier de données introuvable.");
        allMedia = await response.json();
        
        computeTrendingOfTheDay();
        renderFeed();
      } catch (err) {
        console.error("Erreur de chargement :", err);
        document.getElementById('feedGrid').innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 40px;">Impossible de charger les actualités. Vérifiez que les scripts de synchronisation ont bien tourné.</div>`;
      }
    }

    // FONCTION DE RAFRAÎCHISSEMENT MANUEL LIMITÉE À 2 FOIS PAR JOUR
    async function manualRefreshData() {
      const today = new Date().toISOString().split('T')[0]; // Date du jour au format YYYY-MM-DD
      let lastRefreshDate = localStorage.getItem('hugo_refresh_date') || '';
      let refreshCount = parseInt(localStorage.getItem('hugo_refresh_count') || '0', 10);

      // Si on a changé de jour, on réinitialise le compteur à 0
      if (lastRefreshDate !== today) {
        lastRefreshDate = today;
        refreshCount = 0;
      }

      // Vérification de la limite
      if (refreshCount >= 2) {
        alert("⚠️ Vous avez atteint la limite de 2 actualisations manuelles autorisées pour aujourd'hui.");
        return;
      }

      // Incrémentation et sauvegarde dans le navigateur
      refreshCount++;
      localStorage.setItem('hugo_refresh_date', lastRefreshDate);
      localStorage.setItem('hugo_refresh_count', refreshCount);

      // Exécution du rafraîchissement
      await loadData();
      console.log(`Actualisation manuelle effectuée (${refreshCount}/2 aujourd'hui).`);
    }

    function switchInterface(mode) {
      const body = document.body;
      const btnDesktop = document.getElementById('btnDesktopView');
      const btnMobile = document.getElementById('btnMobileView');

      if (mode === 'mobile') {
        body.classList.add('mobile-mode');
        btnMobile.classList.add('active');
        btnDesktop.classList.remove('active');
      } else {
        body.classList.remove('mobile-mode');
        btnDesktop.classList.add('active');
        btnMobile.classList.remove('active');
      }
    }

    function computeTrendingOfTheDay() {
      if (!allMedia || allMedia.length === 0) return;
      // On prend l'élément le plus récent comme tendance du jour
      trendingItemData = allMedia[0];
      if (trendingItemData) {
        document.getElementById('trendingTitle').innerText = trendingItemData.title || "Actualité majeure du jour";
        document.getElementById('trendingBanner').style.display = 'flex';
      }
    }

    function openTrendingItem() {
      if (trendingItemData) {
        openModal(trendingItemData);
      }
    }

    function filterFeed(tab, event) {
      currentTab = tab;
      document.querySelectorAll('.tabs-container .tab-btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');

      document.getElementById('podcastThemesContainer').style.display = (tab === 'podcast') ? 'flex' : 'none';
      document.getElementById('youtubeChannelsContainer').style.display = (tab === 'youtube') ? 'flex' : 'none';
      document.getElementById('youtubeFormatsContainer').style.display = (tab === 'youtube') ? 'flex' : 'none';

      renderFeed();
    }

    function filterPodcastTheme(theme, event) {
      currentPodcastTheme = theme;
      document.querySelectorAll('#podcastThemesContainer .sub-tab-btn').forEach(b => b.classList.remove('active-pod'));
      if (event && event.target) event.target.classList.add('active-pod');
      renderFeed();
    }

    function filterYoutubeChannel(channelKey, event) {
      currentYoutubeChannel = channelKey;
      document.querySelectorAll('#youtubeChannelsContainer .sub-tab-btn').forEach(b => b.classList.remove('active-yt'));
      if (event && event.target) event.target.classList.add('active-yt');
      renderFeed();
    }

    function filterYoutubeFormat(format, event) {
      currentYoutubeFormat = format;
      document.querySelectorAll('#youtubeFormatsContainer .sub-tab-btn').forEach(b => b.classList.remove('active-yt'));
      if (event && event.target) event.target.classList.add('active-yt');
      renderFeed();
    }

    function handleSearch(query) {
      currentSearchQuery = query.toLowerCase().trim();
      renderFeed();
    }

    function applyDateFilter(dateStr) {
      selectedDateFilter = dateStr; // Format YYYY-MM-DD fourni par l'input date
      renderFeed();
    }

    function resetDateFilter() {
      document.getElementById('datePicker').value = '';
      selectedDateFilter = '';
      renderFeed();
    }

    function renderFeed() {
      const grid = document.getElementById('feedGrid');
      grid.innerHTML = '';

      let filtered = allMedia.filter(item => {
        // Filtrage par onglet principal
        if (item.type !== currentTab) return false;

        // Sous-filtres spécifiques
        if (currentTab === 'podcast' && currentPodcastTheme !== 'all' && item.theme !== currentPodcastTheme) return false;
        if (currentTab === 'youtube') {
          if (currentYoutubeChannel !== 'all' && item.channel !== currentYoutubeChannel) return false;
          if (currentYoutubeFormat !== 'all' && item.format !== currentYoutubeFormat) return false;
        }

        // Filtre par date exacte
        if (selectedDateFilter && item.dateIso !== selectedDateFilter) return false;

        // Filtrage multicritère intelligent de la barre de recherche
        if (currentSearchQuery) {
          const title = (item.title || "").toLowerCase();
          const caption = (item.fullCaption || "").toLowerCase();
          
          if (currentTab === 'instagram') {
            // Instagram : recherche stricte sur la légende uniquement
            if (!caption.includes(currentSearchQuery)) return false;
          } else if (currentTab === 'youtube') {
            // YouTube : recherche stricte sur le titre uniquement
            if (!title.includes(currentSearchQuery)) return false;
          } else {
            // Podcasts / Autres : recherche globale titre + description
            if (!title.includes(currentSearchQuery) && !caption.includes(currentSearchQuery)) return false;
          }
        }

        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 50px; font-size: 1rem;">Aucun contenu trouvé pour cette sélection.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = item.type === 'instagram' ? 'card card-insta clickable' : 'card clickable';
        card.onclick = () => openModal(item);

        if (item.type === 'instagram') {
          let imageUrl = item.imageUrl || (item.images && item.images[0]) || '';
          let countInfo = item.images && item.images.length > 1 ? `<span class="carousel-tag">📷 ${item.images.length} images</span>` : `<span class="badge badge-instagram">Instagram</span>`;
          
          card.innerHTML = `
            <div class="insta-img-container">
              <img src="${imageUrl}" alt="Post Instagram" loading="lazy">
            </div>
            <div class="insta-overlay">
              ${countInfo}
              <span class="card-date">${item.date || 'Récents'}</span>
            </div>
          `;
        } else if (item.type === 'youtube') {
          let badgeText = item.format === 'short' ? 'Short YouTube' : (item.channel === 'grands_formats' ? 'Grands Formats' : 'Actus du jour');
          card.innerHTML = `
            <div class="media-box">
              <img src="https://i.ytimg.com/vi/${item.id}/hqdefault.jpg" alt="${item.title}" loading="lazy">
            </div>
            <div class="card-body">
              <h3 class="card-title">${item.title}</h3>
              <div class="card-footer">
                <span class="badge badge-youtube">${badgeText}</span>
                <span class="card-date">${item.date || 'Récents'}</span>
              </div>
            </div>
          `;
        } else if (item.type === 'podcast') {
          card.innerHTML = `
            <div class="card-body" style="justify-content: space-between; min-height: 200px;">
              <div>
                <span class="badge badge-podcast" style="margin-bottom: 12px; display: inline-block;">🎙️ Podcast • ${item.theme || 'Infos'}</span>
                <h3 class="card-title" style="font-size: 1.15rem; margin-bottom: 8px;">${item.title}</h3>
              </div>
              <div class="card-footer">
                <span class="badge" style="background: rgba(99, 102, 241, 0.15); color: #a5b4fc;">Écouter l'épisode</span>
                <span class="card-date">${item.date || 'Récents'}</span>
              </div>
            </div>
          `;
        }
        grid.appendChild(card);
      });
    }

    // GESTION DE LA MODALE & LECTEUR AUDIO
    function openModal(item) {
      currentModalItem = item;
      currentImgIndex = 0;
      isFullDescVisible = false;

      const modalContainer = document.getElementById('modalMediaContainer');
      const modalBadge = document.getElementById('modalBadge');
      const modalDate = document.getElementById('modalDate');
      const modalTitle = document.getElementById('modalTitle');
      const descSection = document.getElementById('modalDescriptionSection');
      const toggleBtn = document.getElementById('toggleDescBtn');
      const extLink = document.getElementById('modalExternalLink');

      modalContainer.innerHTML = '';
      stopAudio();

      modalTitle.innerText = item.title || '';
      modalDate.innerText = item.date || '';

      if (item.type === 'instagram') {
        modalBadge.className = 'badge badge-instagram';
        modalBadge.innerText = 'Instagram';
        extLink.style.display = 'none';

        let images = item.images && item.images.length > 0 ? item.images : [item.imageUrl];
        if (images.length > 1) {
          let trackHtml = `<div id="carouselTrack" class="carousel-track">` + images.map(img => `<img src="${img}" alt="Slide">`).join('') + `</div>`;
          trackHtml += `<button id="prevBtn" class="carousel-nav-btn prev hidden" onclick="moveCarousel(-1)">❮</button>`;
          trackHtml += `<button id="nextBtn" class="carousel-nav-btn next" onclick="moveCarousel(1)">❯</button>`;
          modalContainer.innerHTML = `<div class="modal-media-box">${trackHtml}</div>`;
        } else {
          modalContainer.innerHTML = `<div class="modal-media-box"><img src="${images[0]}" style="width:150%; height:100%; object-fit:contain; display:block; margin:auto;" alt="Post"></div>`;
        }

        descSection.innerHTML = `<div class="card-caption" style="font-size: 0.98rem; line-height: 1.6; color: #e2e8f0; white-space: pre-line;">${item.fullCaption || ''}</div>`;
        toggleBtn.style.display = 'none';

      } else if (item.type === 'youtube') {
        modalBadge.className = 'badge badge-youtube';
        modalBadge.innerText = item.format === 'short' ? 'Short YouTube' : 'YouTube';
        extLink.style.display = 'inline-flex';
        extLink.href = `https://www.youtube.com/watch?v=${item.id}`;

        modalContainer.innerHTML = `<div class="modal-media-box"><iframe src="${item.embedUrl}?autoplay=1" style="width:100%; height:100%; border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
        
        descSection.innerHTML = `<div class="card-caption" style="font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; max-height: 120px; overflow: hidden; text-overflow: ellipsis;">${item.fullCaption || ''}</div>`;
        toggleBtn.style.display = item.fullCaption && item.fullCaption.length > 150 ? 'inline-flex' : 'none';
        toggleBtn.innerText = '📜 Lire la description complète';

      } else if (item.type === 'podcast') {
        modalBadge.className = 'badge badge-podcast';
        modalBadge.innerText = `Podcast • ${item.theme || 'Infos'}`;
        extLink.style.display = 'none';

        modalContainer.innerHTML = `
          <div class="podcast-hero-box" style="margin: 0; width: 100%; height: 100%; justify-content: center; border-radius: 0;">
            <div style="text-align: center; margin-bottom: 5px;">
              <span style="font-size: 0.85rem; color: #1ed760; font-weight: 700; text-transform: uppercase;">🎧 Épisode officiel HugoDécrypte</span>
            </div>
            <div class="player-controls">
              <button class="btn-player" onclick="skipAudio(-15)" title="Reculer de 15s">⏪</button>
              <button id="mainPlayBtn" class="btn-player btn-player-main" onclick="togglePlayAudio()">▶</button>
              <button class="btn-player" onclick="skipAudio(15)" title="Avancer de 15s">⏩</button>
            </div>
            <div class="progress-bar-container">
              <span id="currentTimeLabel" class="time-label">00:00</span>
              <input type="range" id="audioSeekbar" class="progress-bar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
              <span id="durationLabel" class="time-label">00:00</span>
            </div>
          </div>
        `;

        audioPlayer = new Audio(item.audioUrl);
        audioPlayer.addEventListener('timeupdate', updateAudioProgress);
        audioPlayer.addEventListener('ended', () => { isPlaying = false; updatePlayButtonUI(); });

        descSection.innerHTML = `<div class="summary-card">${item.descriptionHtml || 'Résumé non disponible.'}</div>`;
        toggleBtn.style.display = 'none';
      }

      document.getElementById('mediaModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('mediaModal').classList.remove('active');
      stopAudio();
    }

    function closeModalOnBg(e) {
      if (e.target.id === 'mediaModal') closeModal();
    }

    function moveCarousel(direction) {
      if (!currentModalItem || !currentModalItem.images) return;
      const totalImages = currentModalItem.images.length;
      currentImgIndex += direction;
      if (currentImgIndex < 0) currentImgIndex = 0;
      if (currentImgIndex >= totalImages) currentImgIndex = totalImages - 1;

      const track = document.getElementById('carouselTrack');
      if (track) {
        track.style.transform = `translateX(-${currentImgIndex * 100}%)`;
      }

      document.getElementById('prevBtn').classList.toggle('hidden', currentImgIndex === 0);
      document.getElementById('nextBtn').classList.toggle('hidden', currentImgIndex === totalImages - 1);
    }

    function toggleFullDescription() {
      isFullDescVisible = !isFullDescVisible;
      const descSection = document.getElementById('modalDescriptionSection');
      const toggleBtn = document.getElementById('toggleDescBtn');

      if (currentModalItem.type === 'youtube') {
        if (isFullDescVisible) {
          descSection.innerHTML = `<div class="card-caption" style="font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; white-space: pre-line;">${currentModalItem.fullCaption || ''}</div>`;
          toggleBtn.innerText = '🔼 Réduire la description';
        } else {
          descSection.innerHTML = `<div class="card-caption" style="font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; max-height: 120px; overflow: hidden; text-overflow: ellipsis;">${currentModalItem.fullCaption || ''}</div>`;
          toggleBtn.innerText = '📜 Lire la description complète';
        }
      }
    }

    // CONTRÔLES AUDIO PODCAST
    function togglePlayAudio() {
      if (!audioPlayer) return;
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
      } else {
        audioPlayer.play();
        isPlaying = true;
      }
      updatePlayButtonUI();
    }

    function stopAudio() {
      if (audioPlayer) {
        audioPlayer.pause();
        audioPlayer = null;
      }
      isPlaying = false;
      if (audioTimer) clearInterval(audioTimer);
    }

    function updatePlayButtonUI() {
      const btn = document.getElementById('mainPlayBtn');
      if (btn) btn.innerText = isPlaying ? '⏸' : '▶';
    }

    function skipAudio(seconds) {
      if (audioPlayer) {
        audioPlayer.currentTime += seconds;
      }
    }

    function seekAudio(value) {
      if (audioPlayer && audioPlayer.duration) {
        audioPlayer.currentTime = (value / 100) * audioPlayer.duration;
      }
    }

    function updateAudioProgress() {
      if (!audioPlayer) return;
      const current = audioPlayer.currentTime;
      const duration = audioPlayer.duration || 0;

      document.getElementById('currentTimeLabel').innerText = formatAudioTime(current);
      document.getElementById('durationLabel').innerText = formatAudioTime(duration);

      const seekbar = document.getElementById('audioSeekbar');
      if (seekbar && duration > 0) {
        seekbar.value = (current / duration) * 100;
      }
    }

    function formatAudioTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    }
  </script>
</body>
</html>

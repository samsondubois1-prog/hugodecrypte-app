name: Mettre à jour les flux HugoDécrypte

on:
  schedule:
    - cron: '0 8,14 * * *'
  
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # Autorise explicitement l'écriture pour le job
    permissions:
      contents: write

    steps:
      - name: Code source checkout
        uses: actions/checkout@v3

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install requests apify-client

      - name: Lancer le script Instagram
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python fetch_instagram.py

      - name: Lancer le script global (YouTube, Podcasts, Fusion)
        run: python fetch_all_feeds.py

      - name: Commit et push automatiques des nouveaux fichiers JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add all_media_data.json instagram_data.json public/all_media_data.json || true
          git commit -m "Mise à jour automatique des flux [skip ci]" || echo "Aucun changement à commiter"
          git push

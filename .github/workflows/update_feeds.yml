name: Mettre à jour les flux HugoDécrypte

on:
  schedule:
    # 8h00 UTC et 14h00 UTC (ce qui correspond à 10h00 et 16h00 en France)
    - cron: '0 8,14 * * *'
  
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
  
    steps:
      - name: Code source checkout
        uses: actions/checkout@v3

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Lancer le script Instagram
        run: python fetch_instagram.py

      - name: Lancer le script global (YouTube, Podcasts, Fusion)
        run: python fetch_all_feeds.py

      - name: Commit et push automatiques des nouveaux fichiers JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add all_media_data.json instagram_data.json public/all_media_data.json || true
          git commit -m "Mise à jour automatique des flux [skip ci]" || echo "Aucun changement à commiter"
          git push
